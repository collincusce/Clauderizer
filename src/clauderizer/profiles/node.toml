name = "node"

[detect]
files = ["package.json", "pnpm-workspace.yaml", "tsconfig.json"]
weight = 10

[commands]
test = "npm test"
build = "npm run build"
lint = "npm run lint"
typecheck = "npm run typecheck"

[preflight]
# mocha "N passing" | node:test spec "ℹ tests N" / TAP "# tests N" | jest/vitest "Tests: N passed"
baseline_test_regex = "(\\d+) passing|(?:ℹ|#) tests (\\d+)|Tests:?\\s+(\\d+) passed"
