[clauderizer]
version = "1"
size = "standard"
preflight_checks = ["branch_base", "clean_tree", "tests", "build", "deps_spotcheck", "branch_creation", "cascade_hygiene", "handoff_presence"]
preflight_advisory = []
procedure_version = "1.13.0"

[host]
profile = "python"
target = "claude-code"
enabled = ["*"]
session_host = "windows-wsl:ubuntu"

[paths]
docs = "docs"
gameplans = "docs/gameplans"

[memory]
active_lessons_warn = 12
project_lessons_warn = 20

[modules]
enabled = ["VISION", "ARCHITECTURE", "DECISIONS", "INVARIANTS", "TESTING", "HARDENING", "GLOSSARY", "ENFORCEMENT"]

[rituals]
preflight = true
cascade = true
amendments = false

[focus]
id = "2026-07-30-untangle-engine-docs-from-project-docs-ownership-becomes-structural-docs-clauderizer-becomes-the-engine-namespace"
